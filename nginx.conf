# ---------------------------------------------------------------------
#  Preproduction. Devant : `cloudflared`, qui parle en clair a ce serveur.
#  Derriere : Gunicorn, sur le service `web`.
# ---------------------------------------------------------------------

# Le TLS est termine par le publicateur — Tailscale Funnel, ou Cloudflare
# le jour ou un vrai domaine existera. Celui-ci annonce le protocole
# d'origine dans `X-Forwarded-Proto`, et Nginx le transmet TEL QUEL.
#
# Le remplacer par `$scheme` — reflexe courant — le remettrait a « http » :
# Django redirigerait vers HTTPS, recevrait la meme requete en clair, et
# recommencerait. ERR_TOO_MANY_REDIRECTS, sans une ligne de journal.
#
# Le repli sur `$scheme` ne sert qu'a la verification locale en clair sur
# 127.0.0.1:8080, ou aucun publicateur n'est dans le trajet.
map $http_x_forwarded_proto $protocole_origine {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Le plafond metier est de 25 Mo (`pieces.taille_maximale_mo`). La
    # marge couvre l'enveloppe du formulaire multipart. Un depot refuse
    # ici rendrait un 413 nu, sans le message du service : mieux vaut
    # laisser passer et que l'application explique le refus.
    client_max_body_size 30m;
    client_body_timeout 120s;

    # Les documents produits passent par LibreOffice, dont le delai de
    # garde applicatif est de 60 secondes (LIBREOFFICE_DELAI).
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------
    #  Les pieces jointes ne sont JAMAIS servies en direct.
    #
    #  Le binaire vit sur le volume `pieces`, sous un nom derive de son
    #  empreinte. Le seul acces legitime est `GET /api/pieces/{uid}/contenu`,
    #  qui verifie le perimetre de l'appelant et inscrit un acces au
    #  journal (RNF-TRACE-01). Exposer /media contournerait les deux :
    #  toute personne connaissant une empreinte lirait le courrier, sans
    #  habilitation et sans trace.
    # -----------------------------------------------------------------
    location /media {
        return 404;
    }

    location /api {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocole_origine;
        # SI LE NAVIGATEUR BOUCLE (ERR_TOO_MANY_REDIRECTS) une fois publie :
        # le publicateur n'envoie pas `X-Forwarded-Proto`. Commentez la ligne
        # ci-dessus, decommentez celle-ci, et relancez le service `proxy`.
        # L'acces local en clair cessera alors de fonctionner — c'est le prix,
        # et il est acceptable une fois la recette ouverte.
        # proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        # Le telechargement d'une piece est un flux : le mettre en tampon
        # ferait attendre l'octet 1 jusqu'a l'octet 25 000 000.
        proxy_buffering off;
    }

    # Routage du navigateur : `react-router` porte les chemins, le serveur
    # rend toujours la page. Sans cette ligne, un rechargement sur
    # /courriers/registre rendrait 404.
    # Les fichiers d'`assets` portent une empreinte dans leur nom : ils
    # sont immuables, et un an de cache ne peut pas servir une version
    # perimee. `index.html`, lui, ne doit jamais etre cache, sinon une
    # livraison ne parvient a personne.
    location /assets {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routage du navigateur : `react-router` porte les chemins, le serveur
    # rend toujours la page. Sans cette ligne, un rechargement sur
    # /courriers/registre rendrait 404.
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
